[package]
name = "sosumi-docs-downloader"
version = "0.1.0"
edition = "2021"
description = "Web scraper for downloading sosumi.ai documentation with proper markdown link handling"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
regex = "1.10"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
walkdir = "2.5"
path-slash = "0.2"
